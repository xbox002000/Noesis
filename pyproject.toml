[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noesis"
version = "0.1.0a0"
description = "An AI-Native Cognitive Runtime for honest reasoning under uncertainty. Practical tools for better context, lower cost, and epistemic honesty in LLM agents."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "Noesis Contributors"}
]
keywords = [
  "ai", "agents", "llm", "epistemic", "context-engineering", "rag", "uncertainty", "honesty"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
clustering = [
  "numpy>=1.23",
  "scikit-learn>=1.2",
]
llm = [
  "openai>=1.0.0",
]
dev = [
  "pytest>=7.0",
  "black",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/xbox002000/Noesis"
Documentation = "https://github.com/xbox002000/Noesis/blob/main/AI_NATIVE_RUNTIME_BLUEPRINT.md"
Repository = "https://github.com/xbox002000/Noesis"

[project.scripts]
noesis = "noesis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["noesis*", "epistemic_kernel*", "semantic_graph*", "experiments.token_efficient_context*"]
# Note: noesis/ provides the clean public API. Other top-level packages are the implementation.
# For most users: `from noesis import TokenEfficientContextBuilder, bootstrap_from_codebase`

[tool.setuptools]
py-modules = []  # we use packages

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
target-version = ['py310']
